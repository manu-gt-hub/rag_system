<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Catalog Chatbot</title>
    <style>
        :root {
            --bg: #0f1115; --panel: #171a21; --panel-2: #1f232c; --border: #2a2f3a;
            --text: #e6e8ec; --muted: #8b93a3; --accent: #4fc3f7; --accent-ink: #04212e;
            --user: #24405a; --error: #ef5350;
        }
        @media (prefers-color-scheme: light) {
            :root {
                --bg: #f4f6f9; --panel: #ffffff; --panel-2: #eef1f5; --border: #d9dee6;
                --text: #1b1f27; --muted: #5d6676; --accent: #0277bd; --accent-ink: #ffffff;
                --user: #dbeefa; --error: #c62828;
            }
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg); color: var(--text);
            height: 100vh; display: flex; flex-direction: column;
        }
        header {
            padding: 0.9rem 1rem; border-bottom: 1px solid var(--border);
            display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;
            background: var(--panel);
        }
        header h1 { font-size: 1.15rem; color: var(--accent); }
        /* Model ids have no spaces: let them wrap so narrow screens don't scroll sideways */
        header .info { color: var(--muted); font-size: 0.8rem; margin-left: auto; min-width: 0; overflow-wrap: anywhere; }
        .lang { display: flex; border: 1px solid var(--border); border-radius: 999px; overflow: hidden; }
        .lang button {
            background: transparent; color: var(--muted); border: none; border-radius: 0;
            height: 30px; padding: 0 0.75rem; font-size: 0.75rem; font-weight: 600;
        }
        .lang button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
        main { flex: 1; overflow-y: auto; padding: 1rem; }
        .thread { max-width: 860px; margin: 0 auto; display: flex; flex-direction: column; gap: 1rem; }

        .welcome { color: var(--muted); text-align: center; padding: 2rem 0 1rem; line-height: 1.6; }
        .chips { display: flex; flex-wrap: wrap; gap: 0.5rem; justify-content: center; margin-top: 1rem; }
        .chip {
            background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
            border-radius: 999px; padding: 0.4rem 0.9rem; font-size: 0.85rem; cursor: pointer;
        }
        .chip:hover { border-color: var(--accent); }

        .msg { padding: 0.8rem 1rem; border-radius: 12px; line-height: 1.55; max-width: 100%; }
        .msg.user { background: var(--user); align-self: flex-end; max-width: 80%; white-space: pre-wrap; }
        .msg.bot { background: var(--panel); border: 1px solid var(--border); }
        .msg.bot ul { margin: 0.4rem 0 0.4rem 1.2rem; }
        .msg.bot p + p { margin-top: 0.5rem; }
        .msg.error { color: var(--error); }
        .meta { color: var(--muted); font-size: 0.75rem; margin-top: 0.6rem; }
        details { margin-top: 0.6rem; }
        summary { cursor: pointer; color: var(--muted); font-size: 0.8rem; }
        .docs { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 0.5rem; margin-top: 0.5rem; }
        .doc {
            display: flex; gap: 0.6rem; background: var(--panel-2); border-radius: 8px;
            padding: 0.5rem; border-left: 3px solid var(--accent); font-size: 0.8rem;
        }
        .doc img { width: 42px; height: 63px; object-fit: cover; border-radius: 4px; flex-shrink: 0; }
        .doc .t { font-weight: 600; }
        .doc .i { color: var(--muted); margin-top: 0.2rem; }

        footer { border-top: 1px solid var(--border); padding: 0.8rem 1rem; background: var(--panel); }
        form { max-width: 860px; margin: 0 auto; display: flex; gap: 0.5rem; align-items: flex-end; flex-wrap: wrap; }
        textarea {
            flex: 1 1 300px; min-height: 44px; max-height: 160px; resize: vertical;
            background: var(--bg); color: var(--text); border: 1px solid var(--border);
            border-radius: 8px; padding: 0.65rem; font: inherit;
        }
        textarea:focus, select:focus { outline: none; border-color: var(--accent); }
        select {
            background: var(--bg); color: var(--text); border: 1px solid var(--border);
            border-radius: 8px; padding: 0.6rem; font: inherit; height: 44px;
        }
        button {
            background: var(--accent); color: var(--accent-ink); border: none; border-radius: 8px;
            padding: 0 1.2rem; height: 44px; font-weight: 600; cursor: pointer; font: inherit;
        }
        button.secondary { background: transparent; color: var(--muted); border: 1px solid var(--border); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .typing { color: var(--muted); font-style: italic; }
        .banner {
            background: var(--panel-2); border-bottom: 1px solid var(--error); color: var(--error);
            padding: 0.6rem 1rem; font-size: 0.85rem; text-align: center;
        }
    </style>
</head>
<body>
    <header>
        <h1 data-i18n="title">🎬📚🎮 Your media catalog</h1>
        <span class="info" id="info">Cloudflare Workers AI · Vectorize · D1</span>
        <div class="lang" role="group" aria-label="Language">
            <button type="button" data-lang="en" aria-pressed="true">EN</button>
            <button type="button" data-lang="es" aria-pressed="false">ES</button>
        </div>
    </header>

    <main id="scroll">
        <div class="thread" id="thread">
            <div class="welcome" id="welcome">
                <span data-i18n="welcome">Ask me for recommendations or anything about your collection:
                movies, TV series, books, music, video games and documentaries.</span>
                <div class="chips">
                    <button class="chip" type="button" data-i18n="chip1">Recommend me a horror movie</button>
                    <button class="chip" type="button" data-i18n="chip2">A science fiction book to read</button>
                    <button class="chip" type="button" data-i18n="chip3">What do I have by Danny Boyle?</button>
                    <button class="chip" type="button" data-i18n="chip4">An RPG for the Game Boy</button>
                    <button class="chip" type="button" data-i18n="chip5">Calm music to work to</button>
                    <button class="chip" type="button" data-i18n="chip6">A documentary about politics</button>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <form id="form">
            <textarea id="input" data-i18n-placeholder="placeholder" placeholder="Type your message... (Enter to send, Shift+Enter for a new line)" rows="1"></textarea>
            <select id="category" data-i18n-title="category" title="Category">
                <option value="" data-i18n="auto">Auto (all)</option>
            </select>
            <button id="send" type="submit" data-i18n="send">Send</button>
            <button id="reset" type="button" class="secondary" data-i18n="reset" data-i18n-title="resetTitle" title="New conversation">New chat</button>
        </form>
    </footer>

    <script>
        const thread = document.getElementById('thread');
        const scroller = document.getElementById('scroll');
        const input = document.getElementById('input');
        const sendBtn = document.getElementById('send');
        let history = [];

        // ---------- UI language (EN / ES, English by default). Answers follow the language of the question. ----------
        const I18N = {
            en: {
                pageTitle: 'Media Catalog Chatbot',
                title: '🎬📚🎮 Your media catalog',
                welcome: 'Ask me for recommendations or anything about your collection: movies, TV series, books, music, video games and documentaries.',
                chip1: 'Recommend me a horror movie',
                chip2: 'A science fiction book to read',
                chip3: 'What do I have by Danny Boyle?',
                chip4: 'An RPG for the Game Boy',
                chip5: 'Calm music to work to',
                chip6: 'A documentary about politics',
                placeholder: 'Type your message... (Enter to send, Shift+Enter for a new line)',
                category: 'Category',
                auto: 'Auto (all)',
                send: 'Send',
                reset: 'New chat',
                resetTitle: 'New conversation',
                searching: 'Searching your catalog…',
                sources: 'Catalog sources',
                categoryMeta: 'category',
                newChat: 'New conversation. What are you in the mood for?',
                connectionError: 'Connection error',
                categories: { peliculas: 'Movies', libros: 'Books', series: 'TV series', musica: 'Music', videojuegos: 'Video games', documentales: 'Documentaries' },
                errors: {
                    rate_limited: 'Too many requests, please wait a minute.',
                    quota_exceeded: 'The free daily AI quota of this demo is used up. Please try again tomorrow.',
                    message_too_long: 'The message is too long.',
                    internal_error: 'Something went wrong processing the question. Please try again.',
                },
            },
            es: {
                pageTitle: 'Chatbot del catálogo multimedia',
                title: '🎬📚🎮 Tu catálogo multimedia',
                welcome: 'Pídeme recomendaciones o pregúntame lo que quieras de tu colección: películas, series, libros, música, videojuegos y documentales.',
                chip1: 'Recomiéndame una película de terror',
                chip2: 'Un libro de ciencia ficción para leer',
                chip3: '¿Qué tengo de Danny Boyle?',
                chip4: 'Un juego de rol para Game Boy',
                chip5: 'Música tranquila para trabajar',
                chip6: 'Un documental sobre política',
                placeholder: 'Escribe tu mensaje... (Enter para enviar, Shift+Enter para salto de línea)',
                category: 'Categoría',
                auto: 'Auto (todas)',
                send: 'Enviar',
                reset: 'Nueva',
                resetTitle: 'Nueva conversación',
                searching: 'Buscando en tu catálogo…',
                sources: 'Fuentes del catálogo',
                categoryMeta: 'categoría',
                newChat: 'Nueva conversación. ¿Qué te apetece?',
                connectionError: 'Error de conexión',
                categories: { peliculas: 'Películas', libros: 'Libros', series: 'Series', musica: 'Música', videojuegos: 'Videojuegos', documentales: 'Documentales' },
                errors: {
                    rate_limited: 'Demasiadas preguntas seguidas, espera un minuto.',
                    quota_exceeded: 'Se ha agotado la cuota gratuita diaria de IA de esta demo. Vuelve a intentarlo mañana.',
                    message_too_long: 'El mensaje es demasiado largo.',
                    internal_error: 'Algo ha fallado al procesar la pregunta. Inténtalo de nuevo.',
                },
            },
        };
        const storage = {
            get(k) { try { return localStorage.getItem(k); } catch { return null; } },
            set(k, v) { try { localStorage.setItem(k, v); } catch {} },
        };
        let lang = storage.get('lang') || 'en';
        const t = key => I18N[lang][key] ?? I18N.en[key];

        function fillCategories() {
            const select = document.getElementById('category');
            const current = select.value;
            select.querySelectorAll('option:not([value=""])').forEach(o => o.remove());
            for (const [value, label] of Object.entries(t('categories'))) select.add(new Option(label, value));
            select.value = current;
        }

        function applyLang(next) {
            lang = I18N[next] ? next : 'en';
            document.documentElement.lang = lang;
            document.title = t('pageTitle');
            document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => { el.placeholder = t(el.dataset.i18nPlaceholder); });
            document.querySelectorAll('[data-i18n-title]').forEach(el => { el.title = t(el.dataset.i18nTitle); });
            document.querySelectorAll('.lang [data-lang]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
            fillCategories();
        }
        document.querySelectorAll('.lang [data-lang]').forEach(b => b.addEventListener('click', () => {
            applyLang(b.dataset.lang);
            storage.set('lang', lang);
        }));
        applyLang(lang);

        fetch('/api/config').then(r => r.json()).then(cfg => {
            document.getElementById('info').innerHTML =
                `<strong>LLM:</strong> ${esc(cfg.model)} · <strong>embeddings:</strong> ${esc(cfg.embedding_model)} · ` +
                `<strong>Storage:</strong> Vectorize + D1`;
        }).catch(() => {});

        const esc = s => String(s ?? '').replace(/[&<>"']/g, c => (
            {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));

        // Minimal markdown: **bold**, *italic*, "- " / "1. " lists, paragraphs.
        function renderMarkdown(text) {
            const inline = s => esc(s)
                .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
                .replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
            const out = [];
            let list = null;
            for (const line of text.split('\n')) {
                const m = line.match(/^\s*(?:[-*•]|\d+[.)])\s+(.*)$/);
                if (m) {
                    if (!list) { list = []; out.push(list); }
                    list.push(`<li>${inline(m[1])}</li>`);
                } else {
                    list = null;
                    if (line.trim()) out.push(`<p>${inline(line)}</p>`);
                }
            }
            return out.map(x => Array.isArray(x) ? `<ul>${x.join('')}</ul>` : x).join('');
        }

        function addMessage(cls, html) {
            document.getElementById('welcome')?.remove();
            const div = document.createElement('div');
            div.className = `msg ${cls}`;
            div.innerHTML = html;
            thread.appendChild(div);
            scroller.scrollTop = scroller.scrollHeight;
            return div;
        }

        function docsHtml(docs) {
            if (!docs || !docs.length) return '';
            const cards = docs.map(d => {
                const info = [t('categories')[d.category] || d.category, d.year, d.rating ? `★ ${Number(d.rating).toFixed(1)}` : null,
                              `sim ${d.score}`].filter(Boolean).join(' · ');
                const img = d.poster_url ? `<img src="${esc(d.poster_url)}" alt="" loading="lazy">` : '';
                return `<div class="doc">${img}<div><div class="t">${esc(d.title)}</div>
                        <div class="i">${esc(info)}</div>
                        ${d.genre ? `<div class="i">${esc(d.genre)}</div>` : ''}</div></div>`;
            }).join('');
            return `<details><summary>${esc(t('sources'))} (${docs.length})</summary><div class="docs">${cards}</div></details>`;
        }

        async function send(text) {
            text = text.trim();
            if (!text) return;
            addMessage('user', esc(text));
            input.value = '';
            sendBtn.disabled = true;
            const pending = addMessage('bot typing', esc(t('searching')));

            try {
                const resp = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        message: text,
                        history,
                        category: document.getElementById('category').value || null,
                        lang,
                    }),
                });
                const data = await resp.json();
                pending.remove();
                if (data.error) {
                    addMessage('bot error', esc(t('errors')[data.code] || data.error));
                    return;
                }
                const meta = `${data.provider} · ${data.elapsed_seconds}s` +
                             (data.category ? ` · ${t('categoryMeta')}: ${t('categories')[data.category] || data.category}` : '');
                addMessage('bot', renderMarkdown(data.answer) +
                           `<div class="meta">${esc(meta)}</div>` + docsHtml(data.docs));
                history.push({role: 'user', content: text}, {role: 'assistant', content: data.answer});
            } catch (e) {
                pending.remove();
                addMessage('bot error', `${esc(t('connectionError'))}: ${esc(e.message)}`);
            } finally {
                sendBtn.disabled = false;
                input.focus();
            }
        }

        document.getElementById('form').addEventListener('submit', e => { e.preventDefault(); send(input.value); });
        input.addEventListener('keydown', e => {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(input.value); }
        });
        document.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => send(c.textContent)));
        document.getElementById('reset').addEventListener('click', () => {
            history = [];
            thread.innerHTML = '';
            addMessage('bot', `<p>${esc(t('newChat'))}</p>`);
        });
        input.focus();
    </script>
</body>
</html>
