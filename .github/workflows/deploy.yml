# Continuous deployment to Cloudflare on every push to main:
#   test -> re-index if the catalog changed -> deploy -> smoke test -> evaluation
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN   permissions: Workers Scripts Edit, D1 Edit,
#                          Vectorize Edit, Workers AI Read
#   CLOUDFLARE_ACCOUNT_ID
# Without them the deploy is skipped with a warning (e.g. on forks).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    name: Index & deploy
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Check Cloudflare credentials
        id: creds
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning title=Deploy skipped::Set the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets to deploy."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      # Embeddings are only recomputed when the catalog, the document format or
      # the embedding model changed (signature stored in D1)
      - name: Re-index catalog if it changed
        if: steps.creds.outputs.ok == 'true'
        run: npm run index -- --if-changed

      - name: Deploy Worker
        id: deploy
        if: steps.creds.outputs.ok == 'true'
        run: |
          npx wrangler deploy | tee deploy.log
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test
        if: steps.creds.outputs.ok == 'true'
        run: |
          url="${{ steps.deploy.outputs.url }}"
          curl -fsS "$url/health"
          code=$(curl -sS -o search.json -w "%{http_code}" -X POST "$url/api/search" \
            -H "Content-Type: application/json" -d '{"question": "Danny Boyle"}')
          cat search.json
          # Search embeds the question with Workers AI: with the free daily quota
          # used up the deploy is fine, but retrieval cannot be checked until tomorrow
          if [ "$code" = 429 ] && grep -q quota_exceeded search.json; then
            echo "::warning::Search not checked: the free daily AI quota is used up"
            exit 0
          fi
          [ "$code" = 200 ] || { echo "Search returned HTTP $code"; exit 1; }
          node -e "const r=require('./search.json'); if (!r.docs?.length) { console.error('No documents retrieved'); process.exit(1) }"

  evaluate:
    name: Rubric evaluation (live)
    needs: deploy
    if: needs.deploy.outputs.url != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      # Fails (red) when the thresholds of doc/rubrics.md are not met; the
      # deploy itself has already happened. Skips with a warning when the free
      # daily AI quota is used up.
      - name: Evaluate deployed Worker
        run: npm run evaluate -- --url "${{ needs.deploy.outputs.url }}" --strict

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation-results
          path: evaluation/results.md
          if-no-files-found: ignore
          retention-days: 30
