# Continuous deployment to Cloudflare on every push to main:
#   test -> re-index if the catalog changed -> deploy -> smoke test -> evaluation
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN   permissions: Workers Scripts Edit, D1 Edit,
#                          Vectorize Edit, Workers AI Read
#   CLOUDFLARE_ACCOUNT_ID
# Without them the deploy is skipped with a warning (e.g. on forks).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    name: Index & deploy
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.deploy.outputs.url }}
      evaluate: ${{ steps.changes.outputs.evaluate }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2 # to compare with the previous commit on main

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      # The live evaluation spends ~1,300 of the 10,000 free daily Neurons, so it
      # only runs when answer quality can change (not for docs, CI or
      # dependency-only merges), or when the workflow is started by hand
      - name: Decide whether to evaluate
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "evaluate=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only HEAD^1 HEAD)
          echo "$changed"
          if echo "$changed" | grep -qE '^(src/|indexer/|resources/|evaluation/|schema\.sql$|wrangler\.jsonc$)'; then
            echo "evaluate=true" >> "$GITHUB_OUTPUT"
          else
            echo "evaluate=false" >> "$GITHUB_OUTPUT"
            echo "Evaluation skipped: no change can affect answer quality" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Check Cloudflare credentials
        id: creds
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning title=Deploy skipped::Set the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets to deploy."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      # Embeddings are only recomputed when the catalog, the document format or
      # the embedding model changed (signature stored in D1)
      - name: Re-index catalog if it changed
        if: steps.creds.outputs.ok == 'true'
        run: npm run index -- --if-changed

      - name: Deploy Worker
        id: deploy
        if: steps.creds.outputs.ok == 'true'
        run: |
          npx wrangler deploy | tee deploy.log
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test
        if: steps.creds.outputs.ok == 'true'
        run: |
          url="${{ steps.deploy.outputs.url }}"
          curl -fsS "$url/health"
          code=$(curl -sS -o search.json -w "%{http_code}" -X POST "$url/api/search" \
            -H "Content-Type: application/json" -d '{"question": "Danny Boyle"}')
          cat search.json
          [ "$code" = 200 ] || { echo "Search returned HTTP $code"; exit 1; }
          node -e "const r=require('./search.json'); if (!r.docs?.length) { console.error('No documents retrieved'); process.exit(1) }"
          # With the free daily AI quota used up search answers from D1 only:
          # the deploy is fine, but vector retrieval cannot be checked until tomorrow
          if grep -q '"retrieval":"keyword_only"' search.json; then
            echo "::warning::Vector search not checked: the free daily AI quota is used up (keyword-only)"
          fi

  evaluate:
    name: Rubric evaluation (live)
    needs: deploy
    if: needs.deploy.outputs.url != '' && needs.deploy.outputs.evaluate == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      # Fails (red) when the thresholds of doc/rubrics.md are not met; the
      # deploy itself has already happened. Skips with a warning when the free
      # daily AI quota is used up.
      - name: Evaluate deployed Worker
        run: npm run evaluate -- --url "${{ needs.deploy.outputs.url }}" --strict

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: evaluation-results
          path: evaluation/results.md
          if-no-files-found: ignore
          retention-days: 30
