# Synthetic check of the live demo every 6 hours. Uses /api/search (retrieval
# only), so it spends no LLM quota. GitHub emails the repository owner when a
# scheduled run fails.
#
# A used-up free daily AI quota is not an outage: search keeps answering from
# D1 (keyword-only) and the run passes with a warning.
#
# Repository variable: DEMO_URL (e.g. https://rag-catalog.<subdomain>.workers.dev)
name: Monitor

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Live demo health
    runs-on: ubuntu-latest
    steps:
      - name: Health and retrieval
        env:
          DEMO_URL: ${{ vars.DEMO_URL }}
        run: |
          if [ -z "$DEMO_URL" ]; then
            echo "::warning title=Monitor skipped::Set the DEMO_URL repository variable."
            exit 0
          fi
          curl -fsS --retry 3 --retry-delay 10 "$DEMO_URL/health"
          code=$(curl -sS --retry 3 --retry-delay 10 -o search.json -w "%{http_code}" -X POST "$DEMO_URL/api/search" \
            -H "Content-Type: application/json" -d '{"question": "horror movie"}')
          echo "HTTP $code"
          node -e '
            const r = JSON.parse(require("fs").readFileSync("search.json", "utf8"));
            const quota = "::warning title=AI quota used up::";
            if (process.argv[1] !== "200") {
              // Deployments without keyword-only fallback answer 429 quota_exceeded
              if (process.argv[1] === "429" && r.code === "quota_exceeded") {
                console.log(quota + "Search could not run until the daily quota resets (00:00 UTC).");
                process.exit(0);
              }
              console.error(`Search failed: HTTP ${process.argv[1]} ${JSON.stringify(r)}`);
              process.exit(1);
            }
            console.log(`Documents retrieved: ${r.docs.length} (${r.retrieval ?? "hybrid"})`);
            if (!r.docs.length) { console.error("No documents retrieved"); process.exit(1); }
            if (r.retrieval === "keyword_only") {
              console.log(quota + "Search is answering from D1 only (keyword) until the daily quota resets (00:00 UTC).");
            }
          ' "$code"
