# Typecheck and tests on every push and pull request. No Cloudflare account
# needed: retrieval and API tests run against the real catalog in SQLite.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Typecheck & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
