# Typecheck, tests and Worker build on every push and pull request. No
# Cloudflare account needed: retrieval and API tests run against the real
# catalog in SQLite, UI tests run the chat page in happy-dom.
name: CI

# Runs on every pull request against main (and again on main after the merge)
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Typecheck, tests & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      # Bundles the Worker and validates wrangler.jsonc and its bindings without
      # deploying, so bundling or config errors fail the PR instead of the deploy
      - name: Build Worker (dry run)
        run: npx wrangler deploy --dry-run --outdir dist

  # Supply chain: known vulnerabilities in any dependency, and secrets committed
  # at any point of the history
  security:
    name: Dependencies & secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans the whole history

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      # Fails on high or critical advisories
      - name: npm audit
        run: npm audit --audit-level=high

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
