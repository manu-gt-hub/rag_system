# =============================================================================
# RAG System — CI/CD Evaluation
#
# Runs the accuracy test battery against the full RAG pipeline.
#
# REQUIRED GITHUB CONFIGURATION:
#
#   Secrets  (Settings > Secrets and variables > Actions > Secrets):
#     - OPENAI_API_KEY          OpenAI API key
#     - ANTHROPIC_API_KEY       Anthropic API key (optional if using openai)
#     - POSTGRES_PASSWORD       PostgreSQL password (defaults to "postgres")
#
#   Variables (Settings > Secrets and variables > Actions > Variables):
#     - LLM_PROVIDER            "openai" or "anthropic"  (default: openai)
#     - OPENAI_CHAT_MODEL       OpenAI chat model        (default: gpt-4o-mini)
#     - OPENAI_EMBEDDING_MODEL  Embedding model          (default: text-embedding-3-small)
#     - ANTHROPIC_CHAT_MODEL    Anthropic model          (default: claude-3-5-haiku-20241022)
#     - EMBEDDING_DIMENSION     Embedding dimension      (default: 1536)
#     - TOP_K                   Docs to retrieve         (default: 5)
#     - SIMILARITY_THRESHOLD    Similarity threshold     (default: 0.3)
# =============================================================================

name: RAG Evaluation

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'resources/**'
      - 'requirements.txt'
      - '.github/workflows/rag-evaluation.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:  # Allows manual execution from the GitHub UI

env:
  PYTHON_VERSION: '3.11'

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Basic lint (fast, no services)
  # ---------------------------------------------------------------------------
  lint:
    name: Lint & Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check (py_compile)
        run: |
          python -m py_compile src/config.py
          python -m py_compile src/embeddings.py
          python -m py_compile src/indexer.py
          python -m py_compile src/retriever.py
          python -m py_compile src/generator.py
          python -m py_compile src/rag_pipeline.py
          python -m py_compile src/web_app.py
          python -m py_compile tests/run_evaluation.py
          python -m py_compile tests/test_rag_ci.py

  # ---------------------------------------------------------------------------
  # Job 2: RAG evaluation tests (requires pgvector + API keys)
  # ---------------------------------------------------------------------------
  evaluation:
    name: RAG Evaluation Tests
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: rag_system
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || 'postgres' }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Dynamically generate .env from GitHub Secrets + Variables
      - name: Generate .env from GitHub Secrets & Variables
        run: |
          cat > .env << 'ENVEOF'
          LLM_PROVIDER=${{ vars.LLM_PROVIDER || 'openai' }}
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          OPENAI_EMBEDDING_MODEL=${{ vars.OPENAI_EMBEDDING_MODEL || 'text-embedding-3-small' }}
          OPENAI_CHAT_MODEL=${{ vars.OPENAI_CHAT_MODEL || 'gpt-4o-mini' }}
          ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_CHAT_MODEL=${{ vars.ANTHROPIC_CHAT_MODEL || 'claude-3-5-haiku-20241022' }}
          POSTGRES_HOST=localhost
          POSTGRES_PORT=5432
          POSTGRES_DB=rag_system
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD || 'postgres' }}
          EMBEDDING_DIMENSION=${{ vars.EMBEDDING_DIMENSION || '1536' }}
          TOP_K=${{ vars.TOP_K || '5' }}
          SIMILARITY_THRESHOLD=${{ vars.SIMILARITY_THRESHOLD || '0.3' }}
          FLASK_HOST=0.0.0.0
          FLASK_PORT=5000
          FLASK_DEBUG=false
          ENVEOF

      # Verify pgvector is operational
      - name: Verify pgvector extension
        run: |
          PGPASSWORD=${{ secrets.POSTGRES_PASSWORD || 'postgres' }} \
          psql -h localhost -U postgres -d rag_system \
            -c "CREATE EXTENSION IF NOT EXISTS vector; SELECT extversion FROM pg_extension WHERE extname = 'vector';"

      # Index the catalog into pgvector
      - name: Index catalog into pgvector
        run: python -m src.indexer

      # Run the full evaluation with pytest
      - name: Run RAG evaluation tests
        run: |
          python -m pytest tests/test_rag_ci.py \
            -v \
            --tb=long \
            --junitxml=results/junit-results.xml \
            2>&1 | tee results/test-output.log

      # Also generate the markdown report
      - name: Generate markdown evaluation report
        if: always()
        run: python -m tests.run_evaluation

      # Upload artifacts (report + junit)
      - name: Upload evaluation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-results
          path: |
            results/evaluation_results.md
            results/junit-results.xml
            results/test-output.log
          retention-days: 30

      # Post summary to the PR / workflow run
      - name: Post evaluation summary
        if: always()
        run: |
          echo "## 📊 RAG Evaluation Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f results/evaluation_results.md ]; then
            # Extract only the summary table (first 20 useful lines)
            head -25 results/evaluation_results.md >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Evaluation report was not generated" >> $GITHUB_STEP_SUMMARY
          fi
